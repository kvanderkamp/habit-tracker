<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎯 Habit Tracker</h1>
            <p>Build better habits, one day at a time</p>
        </header>

        <section class="add-habit">
            <input type="text" id="habitInput" placeholder="Enter a new habit..." maxlength="100">
            <button id="addButton">Add Habit</button>
        </section>

        <section class="habits-list" id="habitsList">
            <!-- Habits will be dynamically added here -->
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
